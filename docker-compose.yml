services:
  web-api:
    build: .
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - broker
    networks:
      - frontend
      - backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  nginx:
    image: dhi.io/nginx:1.31.6-debian13
    ports:
      - "80:80"
    volumes:
      - ./volumes/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web-api
    networks:
      - frontend
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  broker:
    image: dhi.io/redis:8.10.2-debian13
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  frontend:
  backend:
    internal: true