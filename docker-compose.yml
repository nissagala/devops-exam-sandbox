version: '3'
services:
  web-api:
    build: .
    depends_on:
      - broker

  nginx: 
    image: dhi.io/nginx:1
    ports:
      - "80:80"
    volumes:
      - ./volumes/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web-api

  broker:
    image: redis:latest # VULNERABILITY: Using 'latest' tag (Mutable/Unpredictable)
    command: redis-server --requirepass admin_password_123